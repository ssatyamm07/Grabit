services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: grabit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grabit
      POSTGRES_PASSWORD: grabit
      POSTGRES_DB: grabit
    ports:
      - "5434:5432"
    volumes:
      - grabit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grabit -d grabit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: grabit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - grabit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: grabit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - grabit_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  grabit_pgdata:
  grabit_redis:
  grabit_minio:
