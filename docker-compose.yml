services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: grabit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grabit
      POSTGRES_PASSWORD: grabit
      POSTGRES_DB: grabit
    ports:
      - "5434:5432"
    volumes:
      - grabit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grabit -d grabit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: grabit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - grabit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: grabit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - grabit_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grabit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://grabit:grabit@postgres:5432/grabit
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-compose-dev-secret-min-32-chars-xx
      SHOW_OTP_IN_RESPONSE: "false"
      OTP_DRY_RUN: "true"
      SMS_DRY_RUN: "true"
      PUSH_DRY_RUN: "true"
      CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

volumes:
  grabit_pgdata:
  grabit_redis:
  grabit_minio:
