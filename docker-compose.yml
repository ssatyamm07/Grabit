services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: grabit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grabit
      POSTGRES_PASSWORD: grabit
      POSTGRES_DB: grabit
    ports:
      - "5434:5432"
    volumes:
      - grabit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grabit -d grabit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: grabit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - grabit_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  grabit_pgdata:
  grabit_redis:
